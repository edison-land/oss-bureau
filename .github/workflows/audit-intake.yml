name: OSS Bureau Intake & Verification Bot

on:
  issues:
    types: [opened, edited, labeled]
  pull_request:
    paths:
      - "cases/**"
      - "evidence/**"

permissions:
  contents: read

jobs:
  triage-issue:
    if: >
      github.event_name == 'issues' &&
      (contains(github.event.issue.labels.*.name, 'case-submission') ||
       contains(github.event.issue.labels.*.name, 'case-tip'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Case Bundle, Hygiene & Remote Source Evidence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bureau_bot.py inspect-issue \
            --event-path "$GITHUB_EVENT_PATH" \
            --out-json /tmp/intake-report.json
      - name: Apply Labels & Post Triage Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("/tmp/intake-report.json", "utf8"));
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const LABEL_COLORS = {
              "tier:blacklist": "dc2626",
              "tier:watchlist": "d97706",
              "tier:cleared": "059669",
              "evidence:verified": "2563eb",
              "evidence:needs-fix": "991b1b",
            };

            for (const name of report.labels) {
              try {
                await github.rest.issues.getLabel({ owner, repo, name });
              } catch {
                await github.rest.issues.createLabel({
                  owner,
                  repo,
                  name,
                  color: LABEL_COLORS[name] || "6b7280",
                }).catch(() => {});
              }
            }

            const currentLabels = (context.payload.issue.labels || []).map((l) => l.name);
            const stale = currentLabels.filter(
              (l) => (l.startsWith("tier:") || l.startsWith("evidence:")) && !report.labels.includes(l)
            );
            for (const name of stale) {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name }).catch(() => {});
            }
            if (report.labels.length > 0) {
              await github.rest.issues.addLabels({ owner, repo, issue_number, labels: report.labels });
            }

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 50,
            });
            const existing = comments.data.find((c) => (c.body || "").includes("<!-- oss-bureau-bot -->"));
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: report.comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: report.comment,
              });
            }

  archive-approved-issue:
    if: >
      github.event_name == 'issues' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'approved' &&
      (contains(github.event.issue.labels.*.name, 'case-submission') ||
       contains(github.event.issue.labels.*.name, 'case-tip'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Verify Maintainer Permission
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const username = context.actor;
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner,
              repo,
              username,
            });
            if (!["admin", "maintain", "write"].includes(data.permission)) {
              core.setFailed(`Actor ${username} lacks write permission to approve archiving.`);
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Archive Case Bundle & Image Attachments
        id: archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bureau_bot.py archive-issue --event-path "$GITHUB_EVENT_PATH"
      - name: Create or Update Archive Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE_PATH: ${{ steps.archive.outputs.file_path }}
          EVIDENCE_DIR: ${{ steps.archive.outputs.evidence_dir }}
          ATTACHMENTS_COUNT: ${{ steps.archive.outputs.attachments_count }}
          TARGET_NAME: ${{ steps.archive.outputs.target_name }}
          TIER: ${{ steps.archive.outputs.tier }}
          CASE_ID: ${{ steps.archive.outputs.case_id }}
          ISSUE_NUMBER: ${{ steps.archive.outputs.issue_number }}
          SUBMITTED_BY: ${{ steps.archive.outputs.submitted_by }}
        run: |
          BRANCH="archive/issue-${ISSUE_NUMBER}"
          git config user.name "oss-bureau-bot[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$FILE_PATH"
          if [ -d "$EVIDENCE_DIR" ]; then
            git add "$EVIDENCE_DIR"
          fi
          git commit -m "feat(cases): archive ${TARGET_NAME} (${CASE_ID}) from #${ISSUE_NUMBER}"
          git push -f origin "$BRANCH"

          PR_URL=$(gh pr list --head "$BRANCH" --state open --json url -q '.[0].url')
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "feat(cases): archive ${TARGET_NAME} [${TIER}] (#${ISSUE_NUMBER})" \
              --body "Archived from approved evidence Issue #${ISSUE_NUMBER} (submitted by @${SUBMITTED_BY}).\n\n- **Case ID**: \`${CASE_ID}\`\n- **Tier**: \`${TIER}\`\n- **Case JSON**: \`${FILE_PATH}\`\n- **Archived Attachments**: \`${ATTACHMENTS_COUNT}\`\n\nCloses #${ISSUE_NUMBER}")
          fi
          gh issue comment "$ISSUE_NUMBER" --body "Archive PR ready for merge (${ATTACHMENTS_COUNT} attachment(s) archived): ${PR_URL}"

  verify-case-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Changed Cases & 100% Evidence Attachment Accounting
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CHANGED=$(git diff --name-only --diff-filter=AM "origin/${{ github.base_ref }}...HEAD" -- 'cases/*.json')
          if [ -z "$CHANGED" ]; then
            python3 scripts/bureau_bot.py inspect-pr --all --no-network --out-md /tmp/pr-report.md
          else
            python3 scripts/bureau_bot.py inspect-pr $CHANGED --out-md /tmp/pr-report.md
          fi
          cat /tmp/pr-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Comment Verification Report on PR
        if: always() && hashFiles('/tmp/pr-report.md') != ''
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("/tmp/pr-report.md", "utf8");
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 50 });
            const existing = comments.data.find((c) => (c.body || "").includes("<!-- oss-bureau-pr-bot -->"));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
