name: Deploy OSS Bureau Web to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "web/**"
      - "cases/**"
      - "evidence/**"
      - "scripts/bureau_bot.py"
      - ".github/workflows/deploy-pages.yml"
  issues:
    types: [opened, edited, closed, labeled]
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    if: >
      github.event_name != 'issues' ||
      contains(github.event.issue.labels.*.name, 'case-submission') ||
      contains(github.event.issue.labels.*.name, 'case-tip')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate Case Registry, Sync Issues & Export AX Endpoints
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/bureau_bot.py inspect-pr --all --no-network
          python3 scripts/bureau_bot.py sync-issues --repo "${{ github.repository }}" --out web/src/data/communityIssues.json
          python3 scripts/bureau_bot.py export-ax --out-dir web/public
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install & Build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
