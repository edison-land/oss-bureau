name: "Case Submission / 提交开源审计案宗"
description: "Submit verifiable evidence (case-bundle.json) and optional screenshots from oss-audit or your own Skill."
title: "[Case] owner/repo"
labels: ["case-submission"]
body:
  - type: markdown
    attributes:
      value: |
        All evidence lives permanently in this public Issue. Automated CI checks:
        - `case-bundle.v1.json` schema validation & deterministic tier calculation
        - Canonical `https://` URLs only (shortlinks like `t.co` / `bit.ly` are blocked)
        - Secret hygiene scan (blocks accidental tokens/keys)
        - Remote GitHub API check of target repo, commit SHA, file paths & code snippets
        - Uploaded screenshots (PNG/JPG/WebP ≤ 5 MB) are automatically archived into `evidence/` on approval

  - type: input
    id: target_repo
    attributes:
      label: Target Repository
      placeholder: "owner/repo"
    validations:
      required: true

  - type: input
    id: commit_hash
    attributes:
      label: Audited Commit SHA
      placeholder: "e.g. 70bde71191"
    validations:
      required: true

  - type: input
    id: auditor_tool
    attributes:
      label: Auditor Skill or Tool
      placeholder: "oss-audit v1.0.0"
    validations:
      required: true

  - type: textarea
    id: case_bundle_json
    attributes:
      label: "case-bundle.json (v1.0.0)"
      render: json
      placeholder: |
        {
          "schema_version": "1.0.0",
          "generated_at": "2026-11-26T00:00:00Z",
          "auditor_tool": "oss-audit v1.0.0",
          "target": { "name": "owner/repo", "repo_url": "https://github.com/owner/repo", "commit_hash": "abcdef1234", "audited_scope": "repo" },
          "verdict": { "risk_level": "MEDIUM", "one_liner": "...", "promise_vs_reality": "CONSISTENT", "default_telemetry": "OPT_OUT_EASY", "cross_tool_access": false },
          "findings": [],
          "user_mitigations": [{ "action": "Disable telemetry", "command_or_config": "export DO_NOT_TRACK=1" }]
        }
    validations:
      required: true

  - type: textarea
    id: attachments
    attributes:
      label: Evidence Attachments (Optional Screenshots)
      description: "Drag & drop PNG/JPG/WebP screenshots (≤ 5 MB each) of privacy claims, network captures, or terminal scans. Approved screenshots are archived permanently in `evidence/`."
      placeholder: "Drop screenshots directly here..."
    validations:
      required: false

  - type: textarea
    id: notes
    attributes:
      label: Additional Canonical URLs / Context (Optional)
      description: "Direct https:// URLs only (GitHub PRs, commits, archived docs). Never use shortened links."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Verification Confirmation
      options:
        - label: "All claims cite public source files, commit SHAs, or verifiable primary records (no shortlinks)."
          required: true
        - label: "No private personal data, API keys, tokens, or secrets are included."
          required: true
